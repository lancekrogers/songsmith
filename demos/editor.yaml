# Throwaway settings for demos/editor.tape. Every path is under
# /tmp/songsmith-demo-editor, ComfyUI's port has nothing on it, and Ollama is
# demos/setupfake's stand-in with made-up models and a canned draft, so the
# recording never touches a real install.
library_dir: /tmp/songsmith-demo-editor/library
state_dir: /tmp/songsmith-demo-editor/state
comfyui:
  dir: /tmp/songsmith-demo-editor/ComfyUI
  port: 18188
ollama:
  url: http://127.0.0.1:18491
  model: songwriter:7b
